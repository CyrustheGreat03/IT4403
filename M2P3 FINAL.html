<!DOCTYPE html>
<html>
<head>
<title> Search Books </title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body> 
<div class="full_web">

<header>

<div class="Top_section"> 
<h1> Naveed Noori </h1>
<p> IT 4403 - Advanced Web and Mobile Applications</p>
</div>

<nav>
<a href="index.html">HOME PAGE </a>
<a href="M2P3 FINAL.html">SEARCH</a>
<a href="M2P5 FINAL.html">MY BOOKSHELF </a>

</header>

<!--Buttons-->

<div class="Buttons"> 
<input id="TextBox" type="text" placeholder="Search Keywords (Example: App Development)">
<button id="SearchButton">Search</button>
<select id="NumberofPages"> </select>
</div>

<div class="Result"></div>

<script> 

user_input = "" 
number_of_results = 20 //num of results per page 
pagebegin = 0 //the start index 

$('#SearchButton').click(function(){ //button
    user_input=$('#TextBox').val()
    pagenums()
    resultnums(pagebegin)
})

function pagenums(){
    $('#NumberofPages').html("")

    for(i=0;i<3;i++){ //Keeps number of pages at 3

        max=i*number_of_results
        $('#NumberofPages').append(
            "<option value='"+ max +"'>Page "+(i+1)+"</option>")

    }}

$('#NumberofPages').change(function(){ //CHECK- when numpage change
    pagebegin = $(this).val()
    resultnums(pagebegin)

})


function resultnums(pagebegin){

    $(".Result").html("")
    //URL
    url = "https://www.googleapis.com/books/v1/volumes?q=" + user_input +"&maxResults=" + number_of_results +"&startIndex=" + pagebegin +"&key=AIzaSyCKfwA19zlxpWUozLUu6PwikkFIodUt22Y"
    
    //Instead of fetch() I am using jquery because I am more familiar with it. CITE for $.getJSON for url- https://api.jquery.com/jQuery.getJSON/
    
    $.get(url, function(json_MultipleBooks){ //Based off Milestone 1 Mult Books
        for (i = 0; i<json_MultipleBooks.items.length; i++){ //Loop


            title = json_MultipleBooks.items[i].volumeInfo.title
            id = json_MultipleBooks.items[i].id //no volID for id
            authors = json_MultipleBooks.items[i].volumeInfo.authors
            publisher = json_MultipleBooks.items[i].volumeInfo.publisher
            date = json_MultipleBooks.items[i].volumeInfo.publishedDate
            thumbnail = json_MultipleBooks.items[i].volumeInfo.imageLinks.thumbnail
    
            //Result goes back to html div
            $(".Result").append(`

                <div class="Book_Background">
                    <img src="${thumbnail}" class="Img">
                    <div class="bookInfo">
                        
                        <h3>
                            <a href="M2P4 FINAL.html?id=${id}">${title}</a>
                        </h3>

                        <p><b>Authors:</b> ${authors}</p>
                        <p><b>Publisher:</b> ${publisher}</p>
                        <p><b>Published:</b> ${date}</p>

                        <div class="preview">
                            <a href="https://books.google.com/books?id=${id}" target="_blank">Preview</a>
                        </div>

                    </div>
                </div>

`)
        }
    })
}



</script>

<style>

body {
    background-color: plum;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.full_web {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    text-decoration: none;
    background-color: black;
    color:white;
    border-radius: 5px;
    padding: 10px 20px;
    margin-left: 10px;
}


.Buttons{
    text-align: center;
}

#TextBox {
    padding:10px 30px;
    width: 300px;
    margin-top: 50px;
    border-radius: 15px;

}
#SearchButton{

    padding: 5px 20px;
    background-color: black;
    color: white;
    border-radius: 20px;
}

#NumberofPages {
    padding: 0px 10px;
    border-radius: 10px;

}


.Result{
    
    display: grid;
    gap: 20px;
    margin-top: 50px;
    grid-template-columns:repeat(3, 325px); /* CITE: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/grid-template-columns */
    text-align: center;

}

.Book_Background{
    background-color: white;
    padding: 20px;
    border-radius: 20px;
}

.preview{

    padding: 5px 5px;
    border-radius: 10px;
    text-decoration: none;

}

</style>
