<!DOCTYPE html>
<html>
<head>
<title> Book Info </title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<div class="full_web">

<header>
    <div class="Top_section"> 
        <h1> Naveed Noori </h1>
        <p> IT 4403 - Advanced Web and Mobile Applications</p>
    </div>

    <nav>
        <a href="M2P3 FINAL.html">SEARCH</a>
        <a href="M2P5 FINAL.html">MY BOOKSHELF </a>
    </nav>
</header>

<div id="Book_Info"></div>


<script>

params = new URLSearchParams(window.location.search) // CITE: https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams
id = params.get("id")

url = "https://www.googleapis.com/books/v1/volumes/"+id+"?&key=AIzaSyCKfwA19zlxpWUozLUu6PwikkFIodUt22Y"

//Restrict key to website once comp


$.getJSON(url, function(json_singlebook){

        title = json_singlebook.volumeInfo.title 
        pages = json_singlebook.volumeInfo.pageCount
        authors = json_singlebook.volumeInfo.authors
        publisher = json_singlebook.volumeInfo.publisher
        categories = json_singlebook.volumeInfo.categories
        date = json_singlebook.volumeInfo.publishedDate
        description = json_singlebook.volumeInfo.description
        thumbnail = json_singlebook.volumeInfo.imageLinks.thumbnail



        //no link for title
        $("#Book_Info").append(`

                <div class="Book_Background">
                 <img src="${thumbnail}" class="Img">
                 <div class="bookInfo">
                        
                     <h2>
                         ${title} 
                     </h2>
                      <p><b>Pages:</b> ${pages}</p>
                      <p><b>Authors:</b> ${authors}</p>
                      <p><b>Publisher:</b> ${publisher}</p>
                    <p><b>Categories:</b> ${categories}</p>
                    <p><b>Published:</b> ${date}</p>
                    <p><b>Description:</b> ${description}</p>

                                            

                  </div>
             </div>
`)

        })

    

</script>


<style>

body {
    background-color: plum;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.full_web {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    text-decoration: none;
    background-color: black;
    color:white;
    border-radius: 5px;
    padding: 10px 20px;
    margin-left: 10px;
}

.h2_title{
    text-align: center;
    font-size: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
}

#bookshelf_content{
    
    display: grid;
    gap: 20px;
    margin-top: 50px;
    grid-template-columns:repeat(3, 325px); /* CITE: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/grid-template-columns */
    text-align: center;

}

.Book_Background{
    background-color: white;
    padding: 20px;
    border-radius: 20px;
}

.preview{

    padding: 5px 5px;
    border-radius: 10px;
    text-decoration: none;

}

</style>
