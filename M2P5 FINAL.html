<!DOCTYPE html>
<html>
<head>
<title>My Bookshelf</title>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

<div class="full_web">

<header>
    <div class="Top_section"> 
        <h1> Naveed Noori </h1>
        <p> IT 4403 - Advanced Web and Mobile Applications</p>
    </div>

    <nav>
        <a href="M2P3 FINAL.html">SEARCH</a>
        <a href="M2P5 FINAL.html">MY BOOKSHELF </a>
    </nav>
</header>

<div class="h2_title"> <h2> My Bookshelf </h2> </div>

<div id="bookshelf_content"></div>
</div>

<script> 
    //Google Book ids
    bookID = [
    "d96LDwAAQBAJ",
    "v8NTA2mHL5kC",
    "eQsVEAAAQBAJ",
    "vdivoRxVLBMC",
    "GEWXQbASXZUC"
    ]

    for(id of bookID){
        //url
        url = "https://www.googleapis.com/books/v1/volumes/" + id + "?&key=AIzaSyCKfwA19zlxpWUozLUu6PwikkFIodUt22Y"

        //Instead of fetch() I am using jquery because I am more familiar with it. CITE for $.getJSON for url- https://api.jquery.com/jQuery.getJSON/
        $.getJSON(url, function(json_singlebook){

            title = json_singlebook.volumeInfo.title
            authors = json_singlebook.volumeInfo.authors
            publisher = json_singlebook.volumeInfo.publisher
            date = json_singlebook.volumeInfo.publishedDate
            thumbnail = json_singlebook.volumeInfo.imageLinks.thumbnail

            $("#bookshelf_content").append(`

                 <div class="Book_Background">
                    <img src="${thumbnail}" class="Img">
                    <div class="bookInfo">
                        
                        <h3>
                            <a href="M2P4 FINAL.html?id=${id}">${title}</a>
                        </h3>

                        <p><b>Authors:</b> ${authors}</p>
                        <p><b>Publisher:</b> ${publisher}</p>
                        <p><b>Published:</b> ${date}</p>

                        <div class="preview">
                            <a href="https://books.google.com/books?id=${id}">Preview</a>
                        </div>

                    </div>
                </div>
`)

        })

    }
</script>

<style>

body {
    background-color: plum;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

.full_web {
    max-width: 1000px;
    margin: auto;
    padding: 20px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

nav a {
    text-decoration: none;
    background-color: black;
    color:white;
    border-radius: 5px;
    padding: 10px 20px;
    margin-left: 10px;
}

.h2_title{
    text-align: center;
    font-size: 20px;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif
}

#bookshelf_content{
    
    display: grid;
    gap: 20px;
    margin-top: 50px;
    grid-template-columns:repeat(3, 325px); /* CITE: https://developer.mozilla.org/en-US/docs/Web/CSS/Reference/Properties/grid-template-columns */
    text-align: center;

}

.Book_Background{
    background-color: white;
    padding: 20px;
    border-radius: 20px;
}

.preview{

    padding: 5px 5px;
    border-radius: 10px;
    text-decoration: none;

}

</style>
